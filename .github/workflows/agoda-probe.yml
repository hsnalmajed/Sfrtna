# Agoda direct, site check only: for a few cities, how many shown hotels got
# an Agoda id and Agoda's live rate beside Google's Agoda price (lines start
# with AGODA in the log). By hand.
name: Agoda probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          BASE: https://sfrtna.almajedhsn.workers.dev
        run: |
          ci=$(date -u -d '+21 days' +%F); co=$(date -u -d '+23 days' +%F)
          for city in Riyadh Jeddah Dubai Istanbul; do
            curl -s -H "x-sfrtna-smoke: $SMOKE_TOKEN" \
              "$BASE/api/hotel-prices?q=hotels+in+$city&checkIn=$ci&checkOut=$co&adults=2&agoda=1" \
              | jq -c --arg c "$city" '{city:$c, agoda:.check.agoda}' | sed 's/^/AGODA /'
          done
