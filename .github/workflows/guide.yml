# Our own place guide (scripts/guide/): which places deserve a traveller's
# time (Wikidata fame, World Heritage, visitors, OpenStreetMap facts) and a
# short Arabic/English write-up for each (Gemini, free tier, in daily
# batches; free allowances reset at midnight Pacific time, so the daily run
# starts after 08:00 UTC). Stored in public/data/guide/ — the site never
# calls an AI.
name: Guide

on:
  schedule:
    - cron: "11 8 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "probe | facts | write | costs | all"
        type: string
        default: all
      only:
        description: "Only these cities (comma list)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Probe
        if: inputs.task == 'probe'
        run: npx --yes tsx@4 scripts/guide/probe.ts
      - name: Facts (OpenStreetMap + Wikidata)
        if: inputs.task == 'facts' || inputs.task == 'all' || github.event_name == 'schedule'
        run: npx --yes tsx@4 scripts/guide/build-facts-wd.ts ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: City costs (Gemini)
        if: inputs.task == 'costs' || inputs.task == 'all' || github.event_name == 'schedule'
        run: npx --yes tsx@4 scripts/guide/costs.ts ${{ inputs.only && inputs.only != 'all' && format('--only {0}', inputs.only) || '' }}
      - name: Write-ups (Gemini)
        if: inputs.task == 'write' || inputs.task == 'all' || github.event_name == 'schedule'
        run: npx --yes tsx@4 scripts/guide/write.ts ${{ inputs.only && inputs.only != 'all' && format('--only {0}', inputs.only) || '' }}
      # 6 Nov 2026: saved before the push, so a failed push loses nothing
      # (14 days; download it from the run page).
      - name: Save the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-result
          path: |
            public/data/guide
            public/data/costs.json
            scripts/guide/reports
          retention-days: 14
          if-no-files-found: warn

      - name: Commit
        if: always()
        # Retries the push, splits it if GitHub refuses a big one (6 Nov).
        # -X theirs: this run's files win over an older run's.
        env:
          PULL_ARGS: "-X theirs"
        run: |
          bash scripts/ci/push-to-main.sh "Guide: places checked and written up" public/data/guide public/data/costs.json scripts/guide/reports