# Refreshes the stored places of every city from OpenStreetMap
# (scripts/places/fetch-places.ts → public/data/places/*.json and
# src/data/placeCounts.json). Pages read those files instead of waiting on
# Overpass while a visitor waits.
#
#   - monthly: every city, so new and renamed places come in;
#   - whenever the city list changes (src/data/cityCoords.ts): new cities only;
#   - by hand from the Actions tab (all cities, or only missing ones).
name: Places

on:
  schedule:
    - cron: "41 2 3,13,23 * *"
  push:
    branches: [main]
    paths:
      - "src/data/cityCoords.ts"
      - ".github/workflows/places.yml"
  workflow_dispatch:
    inputs:
      missing_only:
        description: "Only cities with no stored file yet"
        type: boolean
        default: false
      staged:
        description: "The staged cities (not live yet) instead of the live ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm

      - name: Fetch places
        run: |
          npm ci --no-audit --no-fund
          FLAGS=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.missing_only }}" = "true" ]; then FLAGS="--missing"; fi
          if [ "${{ inputs.staged }}" = "true" ]; then FLAGS="$FLAGS --staged"; fi
          npx --yes tsx@4 scripts/places/fetch-places.ts $FLAGS

      # 6 Nov 2026: saved before the push, so a failed push loses nothing
      # (14 days; download it from the run page).
      - name: Save the result
        uses: actions/upload-artifact@v4
        with:
          name: places-result
          path: |
            public/data/places
            src/data/placeCounts.json
            scripts/places/places-fetched-at.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit
        # Retries the push, splits it if GitHub refuses a big one (6 Nov).
        run: |
          bash scripts/ci/push-to-main.sh "Places: stored OpenStreetMap places (automatic run)" public/data/places src/data/placeCounts.json scripts/places/places-fetched-at.json