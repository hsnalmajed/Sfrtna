# Phone speed of the main pages (Lighthouse, mobile, slow-4G throttling as
# Google measures it). By hand; the summary is kept in
# scripts/mobile-speed-report.txt.
name: Mobile speed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Measure
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          npm install --no-save --no-audit --no-fund lighthouse@12
          BASE=https://sfrtna.almajedhsn.workers.dev
          echo "page | score | FCP | LCP | TBT | CLS | JS KB | HTML KB | LCP of each run (median shown)" > scripts/mobile-speed-report.txt
          PAGES="/ar /ar/attractions /ar/attractions/TR/istanbul /ar/seasons /ar/services /ar/itinerary /ar/visa /en/visa"
          # Warm the edge cache first: a deploy changes the cache key, and the
          # first visit per data centre waits for the page to render.
          for p in $PAGES; do curl -s -o /dev/null -H "x-sfrtna-smoke: $SMOKE_TOKEN" "$BASE$p" || true; done
          # Three runs per page, interleaved so a slow minute on the runner
          # does not land on one page only.
          for r in 1 2 3; do
            for p in $PAGES; do
              npx lighthouse "$BASE$p" --quiet --only-categories=performance --form-factor=mobile \
                --extra-headers="{\"x-sfrtna-smoke\":\"$SMOKE_TOKEN\"}" \
                --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="lh-$(echo $p | tr / _)-$r.json" || true
            done
          done
          # One more run per page with applied throttling (Chrome really slowed
          # to phone speed and network) — an independent check on the
          # simulated numbers above.
          for p in $PAGES; do
            npx lighthouse "$BASE$p" --quiet --only-categories=performance --form-factor=mobile --throttling-method=devtools \
              --extra-headers="{\"x-sfrtna-smoke\":\"$SMOKE_TOKEN\"}" \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="dt-$(echo $p | tr / _).json" || true
          done
          for p in $PAGES; do
            node scripts/mobile-speed-summary.mjs "$p" lh-$(echo $p | tr / _)-*.json >> scripts/mobile-speed-report.txt
            node -e '
              try { const a=require("./"+process.argv[1]).audits;
                console.log("   applied throttling (1 run): FCP "+a["first-contentful-paint"].displayValue+", LCP "+a["largest-contentful-paint"].displayValue+", TBT "+a["total-blocking-time"].displayValue);
              } catch { console.log("   applied throttling: no run"); }
            ' "dt-$(echo $p | tr / _).json" >> scripts/mobile-speed-report.txt
          done
          cat scripts/mobile-speed-report.txt
      - name: Keep the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mobile-speed-report.txt
          git commit -m "Mobile speed report" || exit 0
          git pull --rebase origin main && git push
