# Collects every hotel around our cities from OpenStreetMap
# (scripts/hotels/fetch-hotels.ts → scripts/hotels/cities/*.json) and builds
# the files the hotel-name search reads (scripts/hotels/build-index.ts →
# public/data/hotels, public/data/hotel-words). The search then answers from
# our own files: no outside service, no allowance to run out.
#
#   - monthly: every city, so new and renamed hotels come in;
#   - when the city list, the collector or the word cutting changes: new
#     cities only, then the files are rebuilt;
#   - by hand from the Actions tab.
name: Hotels

on:
  schedule:
    - cron: "17 3 5 * *"
  push:
    branches: [main]
    paths:
      - "src/data/cityCoords.ts"
      - "src/lib/hotelIndex.ts"
      - "scripts/hotels/fetch-hotels.ts"
      - "scripts/hotels/build-index.ts"
      - ".github/workflows/hotels.yml"
  workflow_dispatch:
    inputs:
      missing_only:
        description: "Only cities with no collected file yet"
        type: boolean
        default: false
      staged:
        description: "The staged cities (not live yet) instead of the live ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hotels
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm

      - name: Collect hotels
        run: |
          npm ci --no-audit --no-fund
          FLAGS=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.missing_only }}" = "true" ]; then FLAGS="--missing"; fi
          if [ "${{ inputs.staged }}" = "true" ]; then FLAGS="$FLAGS --staged"; fi
          npx --yes tsx@4 scripts/hotels/fetch-hotels.ts $FLAGS

      - name: Build search files
        run: npx --yes tsx@4 scripts/hotels/build-index.ts

      - name: Commit
        run: |
          git add scripts/hotels/cities public/data/hotels public/data/hotel-words
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          MSG="Hotels: stored hotel names (automatic run)"
          TRAILER="Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git commit -m "$MSG" -m "$TRAILER"
          # 5 Nov 2026: GitHub rejected one 750-file push ("fatal error in
          # commit_refs_rules") after a 5-hour run, and the data was lost.
          # So: retry the push; if it still fails, split it into small
          # commits of at most 200 files each and push them one by one.
          push_once() {
            git pull --rebase --autostash origin main && git push origin HEAD:main
          }
          for n in 1 2 3; do
            if push_once; then exit 0; fi
            echo "Push failed (try $n of 3), waiting."
            sleep $((n * 60))
          done
          echo "Splitting the push into small commits."
          git reset --soft HEAD~1
          git reset -q
          git add -A scripts/hotels/cities public/data/hotels public/data/hotel-words
          git diff --cached --no-renames --name-only > /tmp/hotel-files.txt
          git reset -q
          split -l 200 -d /tmp/hotel-files.txt /tmp/hotel-part-
          for part in /tmp/hotel-part-*; do
            xargs -a "$part" -d '\n' git add -A --
            git commit -m "$MSG (part $(basename "$part"))" -m "$TRAILER"
            ok=0
            for n in 1 2 3; do
              if push_once; then ok=1; break; fi
              sleep $((n * 60))
            done
            [ "$ok" = 1 ] || { echo "Part $part could not be pushed."; exit 1; }
          done
