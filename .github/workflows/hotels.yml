# Collects every hotel around our cities from OpenStreetMap
# (scripts/hotels/fetch-hotels.ts → scripts/hotels/cities/*.json) and builds
# the files the hotel-name search reads (scripts/hotels/build-index.ts →
# public/data/hotels, public/data/hotel-words). The search then answers from
# our own files: no outside service, no allowance to run out.
#
#   - monthly: every city, so new and renamed hotels come in;
#   - when the city list, the collector or the word cutting changes: new
#     cities only, then the files are rebuilt;
#   - by hand from the Actions tab.
name: Hotels

on:
  schedule:
    - cron: "17 3 5,15,25 * *"
  push:
    branches: [main]
    paths:
      - "src/data/cityCoords.ts"
      - "src/lib/hotelIndex.ts"
      - "scripts/hotels/fetch-hotels.ts"
      - "scripts/hotels/build-index.ts"
      - ".github/workflows/hotels.yml"
  workflow_dispatch:
    inputs:
      missing_only:
        description: "Only cities with no collected file yet"
        type: boolean
        default: false
      staged:
        description: "The staged cities (not live yet) instead of the live ones"
        type: boolean
        default: false
      from_run:
        description: "Run ID of an earlier Hotels run whose push failed: commit its saved result, no 5-hour collection"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: hotels
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm

      - name: Collect hotels
        if: inputs.from_run == ''
        run: |
          npm ci --no-audit --no-fund
          FLAGS=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.missing_only }}" = "true" ]; then FLAGS="--missing"; fi
          if [ "${{ inputs.staged }}" = "true" ]; then FLAGS="$FLAGS --staged"; fi
          npx --yes tsx@4 scripts/hotels/fetch-hotels.ts $FLAGS

      - name: Build search files
        if: inputs.from_run == ''
        run: npx --yes tsx@4 scripts/hotels/build-index.ts

      # 6 Nov 2026: the 5 Nov result was lost when the push failed. The
      # result is now saved first (14 days); a failed push can be finished
      # later with Run workflow → from_run = that run's ID.
      - name: Save the result
        if: inputs.from_run == ''
        uses: actions/upload-artifact@v4
        with:
          name: hotels-result
          path: |
            scripts/hotels/cities
            scripts/hotels/fetched-at.json
            public/data/hotels
            public/data/hotel-words
          retention-days: 14
          if-no-files-found: error

      - name: Restore a saved result
        if: inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          name: hotels-result
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
          path: .

      - name: Commit
        # Retries the push, splits it if GitHub refuses a big one (6 Nov).
        run: |
          bash scripts/ci/push-to-main.sh "Hotels: stored hotel names (automatic run)" scripts/hotels/cities scripts/hotels/fetched-at.json public/data/hotels public/data/hotel-words