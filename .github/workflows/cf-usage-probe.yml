# One-off (3 Nov 2026): Observability usage vs the 50 GB/month allowance.
# Runs on push to branch cf-usage-probe only; prints shares/GB, no traffic counts.
name: CF usage probe
on:
  push:
    branches: [cf-usage-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/cf-usage-probe.mjs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
