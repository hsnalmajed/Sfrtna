# NASA POWER daily series for destinations ERA5-Land cannot serve (small
# islands with no land cell): scripts/climate/fetch_power.py. By hand. The
# files are pushed to the branch "climate-power" (not main: raw data stays
# out of the site), to be placed in scripts/climate/raw/power/ next to the
# ERA5-Land downloads (owner's PC), where merge_sources.py reads them.
name: Climate NASA POWER

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Destination ids, space-separated"
        required: true
        default: "male mahe maafushi praslin sal roatan easter-island nukualofa"

permissions:
  contents: write

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: python3 scripts/climate/fetch_power.py ${{ inputs.ids }}
      - name: Push to branch climate-power
        run: |
          mkdir -p /tmp/power && cp scripts/climate/raw/power/* /tmp/power/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan climate-power
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/power/* .
          git add -A && git commit -qm "NASA POWER: ${{ inputs.ids }}"
          git push -f origin climate-power
