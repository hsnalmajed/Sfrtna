# Live check of the hotel price source on production (by hand). Spends a few
# paid searches on purpose. Lines start with CHECK in the log.
name: Hotel source check
on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Cities, comma separated"
        type: string
        default: Istanbul,Riyadh
      hotels:
        description: "Compare mode: hotel names to open, | separated"
        type: string
        default: ""
      sources:
        description: "List every site that priced hotels (DataForSEO only)"
        type: boolean
        default: false
      compare:
        description: "Before/after: old source (SerpApi) vs new, same moment"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          CITIES: ${{ inputs.cities }}
          COMPARE: ${{ inputs.compare }}
          HOTELS: ${{ inputs.hotels }}
          SOURCES: ${{ inputs.sources }}
        run: |
          if [ "$SOURCES" = "true" ]; then node scripts/dfs-sources.mjs; elif [ "$COMPARE" = "true" ]; then node scripts/hotel-compare.mjs; else node scripts/dfs-check.mjs; fi
