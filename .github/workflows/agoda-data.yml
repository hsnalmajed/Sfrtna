# Agoda data bundle: Agoda's Hotel Data File (partner download; the link is
# the secret AGODA_HOTEL_FILE_URL, never printed), English + Arabic →
# scripts/agoda/build-bundle.py → agoda-data.tar.zst on the GitHub release
# «agoda-data». release.yml unpacks it into public/data/agoda/ before the
# build, so the data never sits in the code. Monthly + by hand.
name: Agoda data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 3 * *"
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download (English + Arabic)
        env:
          URL: ${{ secrets.AGODA_HOTEL_FILE_URL }}
        run: |
          set -e
          mkdir -p /tmp/ag/en /tmp/ag/ar && cd /tmp/ag
          if [ -z "$URL" ]; then echo "::error::AGODA_HOTEL_FILE_URL missing"; exit 1; fi
          curl -sSfL -o en.zip "$URL"
          curl -sSfL -o ar.zip "${URL//_EN/_AR}"
          unzip -q en.zip -d en && unzip -q ar.zip -d ar && rm en.zip ar.zip
          ls -la en ar | sed 's/^/AGODA /'
      - name: Build bundle
        run: |
          set -e
          python3 -I scripts/agoda/build-bundle.py "$(ls /tmp/ag/en/*.csv)" "$(ls /tmp/ag/ar/*.csv)" /tmp/ag/out
          npx --yes tsx@4 scripts/agoda/build-words.ts /tmp/ag/out
          cd /tmp/ag/out
          echo "AGODA files: $(find . -type f | wc -l)  size: $(du -sh . | cut -f1)"
          echo "AGODA biggest: $(find . -type f -printf '%s %p\n' | sort -n | tail -3 | tr '\n' ' ')"
          grep -E "^(riyadh|jeddah|makkah|madinah|dubai|istanbul|cairo|london|bali)\b" report.txt | sed 's/^/AGODA /'
          tar -C /tmp/ag/out -cf - . | zstd -q -19 -T0 -o /tmp/ag/agoda-data.tar.zst
          echo "AGODA bundle: $(du -h /tmp/ag/agoda-data.tar.zst | cut -f1)"
      - name: Publish to the release «agoda-data»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view agoda-data >/dev/null 2>&1 || gh release create agoda-data --title "Agoda data (generated)" --notes "Built by agoda-data.yml from Agoda's Hotel Data File. Unpacked into public/data/agoda/ by release.yml." --latest=false
          gh release upload agoda-data /tmp/ag/agoda-data.tar.zst /tmp/ag/out/report.txt --clobber
