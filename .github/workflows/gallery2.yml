# City photo tour v2 (scripts/photos/gallery2.ts): views (Pexels) + landmarks
# (Wikimedia Commons) per city, with a contact sheet per city for the eye
# check. Lives on branch `photo-review-v2`; never touches main.
name: Gallery v2 candidates

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these cities (comma list)"
        type: string
        default: ""
      redo:
        description: "Collect the listed cities again"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # «only» without «redo» = sheets for the eye check only: its own group, so the
  # self-chaining collect run never cancels it (and it never touches the branch).
  group: ${{ (inputs.only && !inputs.redo) && 'gallery-sheets' || 'gallery-v3' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bring back the review branch
        run: |
          mkdir -p photo-review
          if git fetch -q origin photo-review-v2 2>/dev/null; then
            git show origin/photo-review-v2:gallery2.json > photo-review/gallery2.json 2>/dev/null || true
          fi
      - name: Collect
        if: ${{ !inputs.only || inputs.redo }}
        run: npx --yes tsx@4 scripts/photos/gallery2.ts collect --max 180 ${{ inputs.only && format('--only {0}', inputs.only) || '' }} ${{ inputs.redo && '--redo' || '' }}
      - name: Save the collection first (a slow sheet run must not lose it)
        if: ${{ !inputs.only || inputs.redo }}
        run: |
          cd photo-review
          rm -f g-*.jpg c-*.jpg c2-*.jpg *.json.bak 2>/dev/null || true
          ls
          git init -q
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git checkout -q -B photo-review-v2
          git add gallery2.json v2-*.jpg v2-index.json 2>/dev/null || git add gallery2.json
          git commit -q -m "Gallery v2 candidates"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-review-v2
      - name: Publish the galleries (famous sights by name; Commons nature waits for the eye check)
        if: ${{ !inputs.only || inputs.redo }}
        run: |
          npx --yes tsx@4 scripts/photos/gallery2.ts build photo-review/gallery2.json
          bash scripts/ci/push-to-main.sh "Photos: city galleries — famous sights first (automatic run)" public/data/gallery public/sitemap-images.xml
      - name: Sheets
        run: npx --yes tsx@4 scripts/photos/gallery2.ts sheets ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Push to the review branch
        if: ${{ !inputs.only || inputs.redo }}
        run: |
          cd photo-review
          rm -f g-*.jpg c-*.jpg c2-*.jpg *.json.bak 2>/dev/null || true
          ls
          git init -q
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git checkout -q -B photo-review-v2
          git add gallery2.json v2-*.jpg v2-index.json 2>/dev/null || git add gallery2.json
          git commit -q -m "Gallery v2 candidates"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-review-v2
      - name: Sheets only → branch photo-sheets (kept apart from photo-review-v2)
        if: ${{ inputs.only && !inputs.redo }}
        run: |
          cd photo-review
          mkdir ../sheets-out && cp v2-*.jpg v2-index.json ../sheets-out/ && cd ../sheets-out
          git init -q
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git checkout -q -B photo-sheets
          git add . && git commit -q -m "Eye-check sheets: ${{ inputs.only }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-sheets
      - name: Next round (GitHub's hourly schedule skips runs; chain until every city has its sights)
        if: ${{ !inputs.only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(npx --yes tsx@4 scripts/photos/gallery2.ts left | tail -1)
          echo "rows without sights: $left"
          if [ "$left" -gt 0 ]; then gh api -X POST repos/${{ github.repository }}/actions/workflows/gallery2.yml/dispatches -f ref=main; fi
