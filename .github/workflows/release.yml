# Release gate (owner, 3 Nov 2026: "no error may reach visitors").
#
# One build, tested before visitors see it:
#   1. build once (opennext)
#   2. deploy that build to the second Worker `sfrtna-staging`
#      (own Durable Objects, own counters, own workers.dev address)
#   3. run the Site check (smoke) and the search pages (e2e) against staging
#   4. only if both are green: deploy the SAME build to production (`sfrtna`)
# Red at step 3 → production stays on the last good version, GitHub mails the
# owner, nothing reaches visitors.
#
# Needs (owner steps, see docs/START_HERE.md): repository secrets
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SMOKE_TOKEN; the Worker secrets
# set on `sfrtna-staging`. Until CLOUDFLARE_API_TOKEN exists this workflow does
# nothing (green, with a notice), so it can sit in main safely.
#
# Cloudflare's own Git build must be switched OFF once this has deployed
# once — otherwise two systems deploy production and the gate is bypassed.
#
# First run: Actions → Release → Run workflow with "production" UNticked:
# builds and tests staging only, production untouched.
name: Release

on:
  push:
    branches: [main]
  # Catch-up (6 Nov 2026): pushes made by other workflows with GITHUB_TOKEN
  # (guide, hotels, photos, reports…) never start a `push` run — GitHub's
  # rule — so their data stayed out of production (guide 4 + 5 Nov). Every
  # hour this releases main if that commit was never through the gate; if
  # it was (green or red), it does nothing, so a red commit mails once only.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production when the staging checks are green"
        type: boolean
        default: true

# Queue, never cancel: stopping a run halfway through a deploy is worse than
# waiting. GitHub keeps only the newest waiting run.
concurrency:
  group: release
  cancel-in-progress: false

# actions: read lets the hourly catch-up see which commit the gate last tested.
permissions:
  contents: read
  actions: read

env:
  STAGING_URL: https://sfrtna-staging.almajedhsn.workers.dev
  PRODUCTION_URL: https://sfrtna.almajedhsn.workers.dev

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `bash` (not the default `bash -e`) turns pipefail on: without it,
    # `wrangler deploy | tail` would hide a failed deploy and the gate would
    # carry on to production.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Are the Cloudflare secrets set?
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$SMOKE_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release gate::Cloudflare secrets are not all set — gate skipped (Cloudflare's Git build still deploys)."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # The newest finished gate run (not this one) that actually ran
            # the gate: success or failure. Same commit → nothing to do.
            last=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=completed&per_page=20" \
              --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion == \"success\" or .conclusion == \"failure\")][0].head_sha")
            if [ -z "$last" ]; then
              # Releasing again is safe (the gate still tests first); a red
              # run here would mark this commit as "tested" and block it.
              echo "::warning title=Release gate::Could not read the last gate run — releasing to be safe."
              last="unknown"
            fi
            if [ "$last" = "$GITHUB_SHA" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Nothing new on main since the last gate run ($last)."
              exit 0
            fi
            echo "::notice title=Release gate::Catch-up: main ($GITHUB_SHA) was never through the gate (last: $last)."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: "22"
          check-latest: true
          cache: npm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build once
        if: steps.guard.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build 2>&1 | tail -n 40

      - name: Staging config
        if: steps.guard.outputs.ready == 'true'
        run: node scripts/make-staging-config.mjs

      - name: Deploy the build to staging
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.jsonc 2>&1 | tail -n 30

      # The same value as the GitHub secret, so the two can never differ.
      # (A secret's value can't be read back from GitHub or Cloudflare; this
      # saves the owner copying it by hand.) The value is never printed.
      - name: Give staging the Site check key
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: printf '%s' "$SMOKE_TOKEN" | npx wrangler secret put SMOKE_TOKEN --config wrangler.staging.jsonc 2>&1 | tail -n 5

      - name: Wait until staging answers
        if: steps.guard.outputs.ready == 'true'
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "x-sfrtna-smoke: $SMOKE_TOKEN" "$STAGING_URL/ar" || true)
            if [ "$code" = "200" ]; then echo "staging answers (attempt $i)"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo "::error title=Release gate::staging did not answer 200 within 5 minutes — production NOT deployed."
          exit 1

      - name: Site check on staging
        if: steps.guard.outputs.ready == 'true'
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: node scripts/smoke.mjs "$STAGING_URL"

      - name: Install the browser
        if: steps.guard.outputs.ready == 'true'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium 2>&1 | tail -n 5

      - name: Search pages on staging
        if: steps.guard.outputs.ready == 'true'
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: node scripts/e2e.mjs "$STAGING_URL"

      - name: Deploy the same build to production
        if: steps.guard.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tail -n 30

      - name: Quick check of production
        if: steps.guard.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.production)
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          sleep 60
          node scripts/smoke.mjs "$PRODUCTION_URL"
