# The whole site checked on two phones, in the browser and in the app, with
# a screenshot of every page (scripts/ux-audit.mjs). By hand, after a
# section's changes are deployed.
name: UX audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Audit every page
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: node scripts/ux-audit.mjs
      # On a branch of their own (never main, so nothing is deployed): the
      # report and the screenshots, replaced on every run.
      - name: Keep the report and screenshots
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r scripts/ux-audit scripts/ux-audit-report.txt /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ux-audit-results
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/* .
          git add -A
          git commit -m "UX audit $(date -u +%FT%TZ)" >/dev/null
          git push -f origin ux-audit-results
