name: Wide-page reports
on:
  workflow_dispatch:
    inputs:
      hours: { description: "Look back hours", default: "168" }
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read the apps' automatic wide-page reports
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          curl -sf -H "x-sfrtna-smoke: $SMOKE_TOKEN" "https://sfrtna.com/api/feedback/recent?hours=${{ inputs.hours }}" -o fb.json || { echo "::error::fetch failed"; exit 1; }
          jq -r '.items[] | select((.text // "") | test("AUTO wide-page")) | "\(.ctx.page // .page // "?") | \(.ctx.device // "" | .[0:40]) | \(.text | gsub("\n"; " ⏎ "))"' fb.json | head -40 | while IFS= read -r l; do echo "::notice::${l:0:3000}"; done
          echo "count=$(jq '[.items[] | select((.text // "") | test("AUTO wide-page"))] | length' fb.json)"
