# Live check of sfrtna.com (scripts/smoke.mjs): the real searches — suggest
# a destination, multi-city, round trip and one way, hotel names, rates,
# places — plus the protection rules. GitHub emails the owner when it fails.
#
# It talks to the Worker at sfrtna.almajedhsn.workers.dev with the
# SMOKE_TOKEN secret — the same random value set in GitHub (repository
# secret) and in Cloudflare (Worker secret). sfrtna.com itself refuses
# GitHub's machines (bot protection), which is why.
#
# Runs every six hours, and after each push to main once the deploy has had
# time to go out (Cloudflare takes about five minutes).
name: Site check

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: sleep 480
      - name: Check the live site
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          if [ -z "$SMOKE_TOKEN" ]; then
            echo "SMOKE_TOKEN is not set (repository secret + Cloudflare secret) — check skipped."
            exit 0
          fi
          node scripts/smoke.mjs
